<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Last One Standing</title>

        <style>

      body {
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
      }

      canvas {
        display: block;
      }

      #winner-overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(5, 6, 8, 0.82);
        text-align: center;
        z-index: 10;
        pointer-events: none;
      }

      #winner-overlay.visible {
        display: flex;
      }

      #winner-name {
        margin: 0;
        font-family: "Arial Black", Arial, sans-serif;
        font-weight: 900;
        font-size: 9vw;
        letter-spacing: 0.04em;
        color: #ffffff;
        -webkit-text-stroke: 3px #000000;
        text-shadow: 0 0 24px rgba(255, 45, 120, 0.85), 0 0 48px rgba(255, 45, 120, 0.5);
      }

      #winner-sub {
        margin-top: 1.5vw;
        font-family: Arial, sans-serif;
        font-weight: 700;
        font-size: 2.2vw;
        color: #ff2d78;
        letter-spacing: 0.03em;
      }

    </style>

  </head>

  <body>

    <div id="winner-overlay">
      <h1 id="winner-name"></h1>
      <p id="winner-sub"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    

    <script
      type="module"
      src="./finalStand.js">
    </script>

  </body>

</html>
